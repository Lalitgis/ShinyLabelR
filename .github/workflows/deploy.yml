name: Deploy to shinyapps.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libmagick++-dev libssl-dev

      - name: Install R packages
        run: |
          install.packages(c("rsconnect", "shiny", "bslib", "shinyjs",
                             "DBI", "RSQLite", "magick", "jsonlite",
                             "ggplot2", "DT", "zip", "base64enc",
                             "fs", "httr2"))
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN:  ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
        run: |
          rsconnect::setAccountInfo(
            name   = "lalit-apps",
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )

          writeLines(
            c(
              paste0("SUPABASE_URL=", Sys.getenv("SUPABASE_URL")),
              paste0("SUPABASE_KEY=", Sys.getenv("SUPABASE_KEY"))
            ),
            ".Renviron"
          )

          rsconnect::deployApp(
            appDir       = ".",
            appName      = "ShinyLabelR",
            account      = "lalit-apps",
            server       = "shinyapps.io",
            forceUpdate  = TRUE,
            launch.browser = FALSE
          )
        shell: Rscript {0}
