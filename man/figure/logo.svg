  <polygon points="340,30 572,162 572,428 340,560 108,428 108,162" fill="#0d1f2d" stroke="#00b4d8" stroke-width="3" style="fill:rgb(13, 31, 45);stroke:rgb(0, 180, 216);color:rgb(255, 255, 255);stroke-width:3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

